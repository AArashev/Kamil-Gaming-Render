<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamil Gaming — 3D Interior</title>
<meta name="description" content="Interactive 3D model of the Kamil Gaming club interior: 12-seat main hall, two 5-seat VIP rooms and reception.">

<!-- Link preview for LinkedIn and other sites.
     After you create the repo, replace aarashev below (2 places) with your GitHub username. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Kamil Gaming — Interactive 3D Interior">
<meta property="og:description" content="Rotate, zoom and look inside: 12-seat main hall, two VIP rooms and reception.">
<meta property="og:image" content="https://aarashev.github.io/kamil-gaming-3d/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:url" content="https://aarashev.github.io/kamil-gaming-3d/">
<meta name="twitter:card" content="summary_large_image">

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #0a0a0d;
    --text: #f2f2f4;
    --muted: #a3a3ad;
    --accent: #ff8a2a;
    --chip: rgba(22, 22, 28, 0.78);
    --chip-border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  model-viewer {
    width: 100vw; height: 100vh; height: 100dvh; display: block;
    background: radial-gradient(ellipse at 50% 40%, #1c1c24 0%, var(--bg) 70%);
    --poster-color: transparent;
    --progress-bar-color: var(--accent);
  }
  .title { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px; pointer-events: none; }
  .title .bar { width: 36px; height: 3px; background: var(--accent); margin-bottom: 10px; }
  .title h1 { margin: 0; font-size: clamp(22px, 4vw, 34px); letter-spacing: 0.02em; line-height: 1.05; font-weight: 800; }
  .title h1 span { color: var(--accent); }
  .title p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .controls { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; width: calc(100% - 32px); max-width: 560px; }
  .controls button, .controls a {
    font: inherit; font-size: 14px; color: var(--text); background: var(--chip);
    border: 1px solid var(--chip-border); border-radius: 999px; padding: 9px 16px; cursor: pointer;
    text-decoration: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .controls button:hover, .controls a:hover { border-color: var(--accent); }
  .controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .title p.place { margin-top: 2px; font-size: 13px; color: var(--accent); }
  .loc { flex-basis: 100%; order: -1; background: var(--chip); border: 1px solid var(--chip-border); border-radius: 16px;
    padding: 14px 16px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); text-align: left; }
  .loc[hidden] { display: none; }
  .loc h2 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
  .loc p { margin: 0 0 4px; font-size: 14px; line-height: 1.45; color: var(--text); }
  .loc p.sub { color: var(--muted); }
  .controls .loc a.map { display: inline-block; margin-top: 10px; background: var(--accent); color: #111; border-color: var(--accent);
    font-weight: 600; }
  .hint { position: fixed; right: 16px; top: max(16px, env(safe-area-inset-top)); color: var(--muted);
    font-size: 12px; text-align: right; line-height: 1.5; pointer-events: none; }
  .pc { display: flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 5px;
    border-radius: 12px; background: rgba(255, 138, 42, 0.95); color: #111; font-weight: 700; font-size: 12px;
    border: 2px solid var(--bg); pointer-events: none; transition: opacity .2s; }
  .pc[data-visible] { opacity: 1; }
  .pc:not([data-visible]) { opacity: 0.25; }
  .numbers-off .pc { display: none; }
  model-viewer:not(:defined) .pc { display: none; }
  @media (max-width: 600px) { .hint { display: none; } }
</style>
</head>
<body>

<model-viewer id="viewer"
  src="kamil-gaming-3d.glb"
  alt="3D model of the Kamil Gaming club interior"
  camera-controls
  touch-action="none"
  auto-rotate
  auto-rotate-delay="2500"
  rotation-per-second="10deg"
  camera-orbit="-36deg 52deg auto"
  min-camera-orbit="auto 0deg auto"
  max-camera-orbit="auto 88deg auto"
  field-of-view="32deg"
  environment-image="neutral"
  exposure="1.3"
  shadow-intensity="0.6"
  interaction-prompt="auto">
</model-viewer>

<div class="title">
  <div class="bar"></div>
  <h1>KAMIL <span>GAMING</span></h1>
  <p>Gaming club interior · 3D</p>
  <p class="place">Arkach Mall · Ashgabat</p>
</div>

<div class="hint">Drag to rotate<br>Scroll / pinch to zoom<br>Right-drag / two fingers to move</div>

<div class="controls">
  <div class="loc" id="loc" hidden>
    <h2>Location</h2>
    <p>Arkach Mall, Magtymguly Ave, Ashgabat</p>
    <p class="sub">Near Ertugrul Gazi Mosque, 1st microdistrict</p>
    <a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Arkach+Shopping+Center%2C+Magtymguly+Ave%2C+Ashgabat" target="_blank" rel="noopener">Open in Google Maps</a>
  </div>
  <button id="btn-ceiling" type="button" aria-pressed="false">Ceiling: off</button>
  <button id="btn-numbers" type="button" aria-pressed="true">PC numbers: on</button>
  <button id="btn-top" type="button">Top view</button>
  <button id="btn-reset" type="button">Reset view</button>
  <button id="btn-loc" type="button" aria-pressed="false">Location</button>
  <a href="kamil-gaming-3d.glb" download>Download .glb</a>
</div>

<script>
  const viewer = document.getElementById('viewer');
  const btnCeiling = document.getElementById('btn-ceiling');
  const START_ORBIT = '-36deg 52deg auto';
  // Materials used only by the three ceiling meshes in this model.
  const CEILING_MATERIALS = new Set(['ceiling', 'light', 'material_8']);
  let ceilingOn = false;

  function setCeiling(show) {
    if (!viewer.model) return;
    for (const m of viewer.model.materials) {
      if (!CEILING_MATERIALS.has(m.name)) continue;
      const c = m.pbrMetallicRoughness.baseColorFactor;
      if (show) {
        m.setAlphaMode('OPAQUE');
        m.pbrMetallicRoughness.setBaseColorFactor([c[0], c[1], c[2], 1]);
      } else {
        m.setAlphaMode('MASK');
        m.setAlphaCutoff(0.5);
        m.pbrMetallicRoughness.setBaseColorFactor([c[0], c[1], c[2], 0]);
      }
    }
    ceilingOn = show;
    btnCeiling.textContent = show ? 'Ceiling: on' : 'Ceiling: off';
    btnCeiling.setAttribute('aria-pressed', String(show));
  }

  // Hide the ceiling as soon as the model loads so you can see inside from above.
  viewer.addEventListener('load', () => {
    try { setCeiling(false); } catch (e) { console.warn('Ceiling toggle unavailable', e); btnCeiling.hidden = true; }
  });

  btnCeiling.addEventListener('click', () => {
    try { setCeiling(!ceilingOn); } catch (e) { console.warn(e); }
  });

  // ---- PC numbers -------------------------------------------------------
  // [number, x, z] — position of each monitor in the model (height is added below).
  // To renumber a computer, just change its number here.
  const PCS = [
    // Main hall (12)
    [1, 2.434, 0.37], [2, 2.766, 0.53], [3, 2.434, 1.27], [4, 2.766, 1.43],
    [5, 2.434, 2.17], [6, 2.766, 2.33], [7, 2.434, 3.07], [8, 2.766, 3.23],
    [9, 2.434, 3.97], [10, 2.766, 4.13], [11, 2.434, 4.87], [12, 2.766, 5.03],
    // VIP 1 (5)
    [13, -2.97, 0.166], [14, -1.87, 0.166], [15, -0.77, 0.166], [16, -2.73, 3.822], [17, -1.63, 3.822],
    // VIP 2 (5)
    [18, -2.97, 4.253], [19, -1.87, 4.253], [20, -2.73, 7.91], [21, -1.63, 7.91], [22, -0.53, 7.91]
  ];
  for (const [n, x, z] of PCS) {
    const el = document.createElement('div');
    el.className = 'pc';
    el.slot = 'hotspot-pc' + n;
    el.dataset.position = `${x}m 1.5m ${z}m`;
    el.dataset.normal = '0m 1m 0m';
    el.textContent = n;
    viewer.appendChild(el);
  }
  const btnNumbers = document.getElementById('btn-numbers');
  btnNumbers.addEventListener('click', () => {
    const off = document.body.classList.toggle('numbers-off');
    btnNumbers.textContent = off ? 'PC numbers: off' : 'PC numbers: on';
    btnNumbers.setAttribute('aria-pressed', String(!off));
  });

  const loc = document.getElementById('loc'), btnLoc = document.getElementById('btn-loc');
  btnLoc.addEventListener('click', () => {
    loc.hidden = !loc.hidden;
    btnLoc.setAttribute('aria-pressed', String(!loc.hidden));
  });

  document.getElementById('btn-top').addEventListener('click', () => {
    viewer.autoRotate = false;
    viewer.resetTurntableRotation(0);
    viewer.cameraOrbit = '0deg 0.5deg auto';
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    viewer.resetTurntableRotation(0);
    viewer.cameraTarget = 'auto auto auto';
    viewer.cameraOrbit = START_ORBIT;
    viewer.autoRotate = true;
  });
</script>
</body>
</html>
