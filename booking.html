<meta name="description" content="Book a PC at Kamil Gaming, Arkach Mall, Ashgabat.">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #0a0a0d; --card: #15151b; --line: rgba(255,255,255,.1); --text: #f2f2f4; --muted: #a3a3ad;
    --accent: #ff8a2a; --free: #2fbf71; --pending: #f5b301; --booked: #e5484d; --walkin: #3b82f6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
  [hidden] { display: none !important; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* header */
  header { position: sticky; top: 0; z-index: 20; background: rgba(10,10,13,.92); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 54px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand span b { color: var(--accent); }
  .langs { display: flex; gap: 4px; }
  .langs button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 8px;
    font-size: 12px; font-weight: 700; color: var(--muted); }
  .langs button.on { background: var(--accent); border-color: var(--accent); color: #111; }

  /* tabs */
  .tabs { display: flex; gap: 8px; padding: 12px 16px 0; max-width: 720px; margin: 0 auto; }
  .tabs button { flex: 1; padding: 10px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    font-weight: 600; color: var(--muted); }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }

  /* 3D stage */
  #stage { position: relative; height: 46vh; min-height: 290px; max-height: 520px; margin-top: 12px;
    background: radial-gradient(ellipse at 50% 40%, #1c1c24 0%, var(--bg) 72%); border-block: 1px solid var(--line); }
  model-viewer { width: 100%; height: 100%; display: block; --poster-color: transparent; --progress-bar-color: var(--accent);
    --min-hotspot-opacity: .4; }
  .stage-btns { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
  .stage-btns button { background: rgba(22,22,28,.8); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .stage-btns button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  /* PC badges (3D hotspots + grid chips) */
  .pc { min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; border: 2px solid var(--bg); color: #111;
    font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  model-viewer .pc { cursor: pointer; }
  .s-free { background: var(--free); } .s-pending { background: var(--pending); }
  .s-booked { background: var(--booked); color: #fff; } .s-walkin { background: var(--walkin); color: #fff; }
  .pc.sel { outline: 3px solid #fff; outline-offset: 1px; transform: scale(1.25); }
  model-viewer:not(:defined) .pc { display: none; }

  /* panels */
  main { max-width: 720px; margin: 0 auto; padding: 14px 16px 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 700; }
  .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .chip { flex: 0 0 auto; min-width: 64px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); text-align: center; display: flex; flex-direction: column; gap: 2px; line-height: 1.15; }
  .chip span { font-size: 12px; color: var(--muted); }
  .chip.on { border-color: var(--accent); background: rgba(255,138,42,.12); }
  .chip.on span { color: var(--accent); }
  .chip:disabled { opacity: .3; cursor: default; }
  .chip.night sup { color: var(--accent); font-size: 9px; margin-left: 2px; }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  .summary { margin: 14px 0 4px; font-size: 17px; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 8px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
  .grid .pc { height: 40px; border-radius: 10px; font-size: 14px; border: 2px solid transparent; }
  .grid .pc.sel { transform: none; outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 18px; }
  .muted { color: var(--muted); font-size: 13px; }
  .btn { display: inline-block; border: 0; border-radius: 12px; padding: 12px 18px; background: var(--accent); color: #111; font-weight: 700; margin-top: 10px; text-decoration: none; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.red { background: var(--booked); color: #fff; } .btn.green { background: var(--free); color: #111; }
  .btn:disabled { opacity: .4; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .timeline { display: flex; gap: 2px; height: 22px; margin-top: 12px; }
  .timeline i { flex: 1; border-radius: 3px; background: var(--free); opacity: .85; }
  .timeline i.s-pending { background: var(--pending); } .timeline i.s-booked { background: var(--booked); }
  .timeline i.s-walkin { background: var(--walkin); } .timeline i.past { opacity: .2; }
  .ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }
  .windows { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .windows button { background: transparent; border: 1px solid var(--free); color: var(--free); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #333; }
  .pill.pending { background: rgba(245,179,1,.2); color: var(--pending); } .pill.confirmed { background: rgba(47,191,113,.2); color: var(--free); }
  .pill.walkin { background: rgba(59,130,246,.2); color: var(--walkin); }
  .pill.rejected, .pill.cancelled, .pill.expired, .pill.done { background: rgba(255,255,255,.08); color: var(--muted); }
  .item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 26px; line-height: 1.5; }
  .note a { color: var(--muted); }
  input[type=text], input[type=tel], input[type=password] { width: 100%; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 14px; margin-top: 6px; font-size: 16px; }
  label { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }

  /* sign-in */
  #signin { min-height: 100vh; min-height: 100dvh; padding: 24px 16px; max-width: 460px; margin: 0 auto; }
  #signin .logo { display: block; width: 96px; height: 96px; border-radius: 22px; margin: 18px auto 14px; }
  #signin h1 { text-align: center; margin: 0; font-size: 26px; }
  #signin p.sub { text-align: center; color: var(--muted); margin: 6px 0 8px; }
  #signin .langs { justify-content: center; margin-top: 8px; }
  .err { color: var(--booked); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* modal + toast */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #modal .box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; max-width: 420px; width: 100%; }
  #modal p { margin: 0 0 6px; line-height: 1.45; }
</style>
</head>

const mem = {};

  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};
const DB = {
  list() { try { return JSON.parse(store.get('kg_bookings') || '[]'); } catch (e) { return []; } },
  save(a) { store.set('kg_bookings', JSON.stringify(a)); },
  add(b) { const a = this.list(); a.push(b); this.save(a); },
  update(id, patch) { const a = this.list(); const b = a.find(x => x.id === id); if (b) Object.assign(b, patch); this.save(a); }
};

const pad = n => String(n).padStart(2, '0');
function clubDays() {
  const n = new Date(); let d = n.getDate(); if (n.getHours() < CLOSE_H) d -= 1;   // before 05:00 we are still in yesterday's club day
  return Array.from({ length: 7 }, (_, i) => ({
    start: new Date(n.getFullYear(), n.getMonth(), d + i, OPEN_H, 0, 0, 0).getTime(),
    close: new Date(n.getFullYear(), n.getMonth(), d + i + 1, CLOSE_H, 0, 0, 0).getTime()
  }));
}
function fmtTime(ms) {
  const d = new Date(ms), h = d.getHours(), m = pad(d.getMinutes());
  if (S.lang === 'en') return `${h % 12 || 12}:${m} ${h < 12 ? 'AM' : 'PM'}`;
  return `${pad(h)}:${m}`;
}
const fmtDM = ms => { const d = new Date(ms); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`; };
const fmtDay = ms => `${WD[S.lang][new Date(ms).getDay()]} ${fmtDM(ms)}`;
const fmtRange = (a, b) => `${fmtTime(a)}–${fmtTime(b)}`;
function fmtDur(min) {
  const h = Math.floor(min / 60), m = min % 60, T = I18N[S.lang];
  return [h ? `${h} ${T.h}` : '', m ? `${m} ${T.min}` : ''].filter(Boolean).join(' ');
}

/* ====================================================================
   BOOKING LOGIC
   ==================================================================== */
function effStatus(b, now) {
  if (b.status === 'pending' && b.createdAt + PENDING_MS <= now) return 'expired';
  if ((b.status === 'confirmed' || b.status === 'walkin') && b.end <= now) return 'done';
  return b.status;
}
// status of one PC for the time window [a, b): free | pending | booked | walkin
function stateOf(pc, a, b, now = Date.now()) {
  let res = { s: 'free' };
  for (const bk of DB.list()) {
    if (bk.pc !== pc) continue;
    const st = effStatus(bk, now);
    if (!(st === 'confirmed' || st === 'walkin' || st === 'pending')) continue;
    if (!(bk.start < b && a < bk.end)) continue;
    if (st === 'pending') { if (res.s === 'free') res = { s: 'pending', bk }; }
    else return { s: st === 'walkin' ? 'walkin' : 'booked', bk };
  }
  return res;
}
// moment from which the PC is free until the next booking (or club close)
function freeUntil(pc, from, close) {
  let t = close; const now = Date.now();
  for (const bk of DB.list()) {
    if (bk.pc !== pc) continue;
    const st = effStatus(bk, now);
    if (!(st === 'confirmed' || st === 'walkin' || st === 'pending')) continue;
    if (bk.start >= from && bk.start < t) t = bk.start;
  }
  return t;
}
function firstSlot(di, days) {
  const now = Date.now();
  for (let s = 0; s < SLOTS; s++) if (days[di].start + s * STEP >= now) return s;
  return -1;
}
function maxDurFor(di, slot, days) {
  return Math.min(MAX_DUR, Math.floor((days[di].close - (days[di].start + slot * STEP)) / 60000));
}
function interval(days) {
  if (S.tab === 'staff') { const n = Date.now(); return [n, n + STEP]; }
  const a = days[S.day].start + S.slot * STEP; return [a, a + S.dur * 60000];
}
function seedDemo() {
  const days = clubDays(), d0 = days[0].start, d1 = days[1].start, now = Date.now();
  const at = (base, h, m) => base + ((h < CLOSE_H ? h + 24 : h) - OPEN_H) * 3600000 + m * 60000;
  const mk = (pc, s, e, status, extra = {}) => ({ id: uid(), pc, start: s, end: e, status, createdAt: now, user: { name:'Demo', surname:'Guest', nick:'demo', phone:'+99361000000' }, ...extra });
  DB.save([
    mk(3, at(d0,14,0), at(d0,16,0), 'confirmed'), mk(5, at(d0,18,0), at(d0,20,30), 'confirmed'),
    mk(14, at(d0,20,0), at(d0,23,0), 'confirmed'), mk(9, at(d0,22,0), at(d0,2,0), 'confirmed'),
    mk(6, at(d0,15,0), at(d0,16,30), 'pending'), mk(8, at(d1,15,30), at(d1,17,30), 'confirmed'),
    mk(20, at(d1,19,0), at(d1,23,0), 'confirmed'),
    mk(1, now - 20 * 60000, now + 70 * 60000, 'walkin', { user: null })
  ]);
  store.set('kg_seeded', '1');
}

  el.type = 'button'; el.slot = 'hotspot-pc' + n; el.dataset.position = `${x}m 1.5m ${z}m`; el.dataset.normal = '0m 1m 0m';
  el.className = 'pc s-free'; el.textContent = n; el.addEventListener('click', () => selectPC(n));
  viewer.appendChild(el); hs[n] = el;
}
const CEIL = new Set(['ceiling', 'light', 'material_8']); let ceilOn = false;
function setCeiling(show) {
  if (!viewer.model) return;
  for (const m of viewer.model.materials) {
    if (!CEIL.has(m.name)) continue;
    const c = m.pbrMetallicRoughness.baseColorFactor;
    if (show) { m.setAlphaMode('OPAQUE'); m.pbrMetallicRoughness.setBaseColorFactor([c[0], c[1], c[2], 1]); }
    else { m.setAlphaMode('MASK'); m.setAlphaCutoff(0.5); m.pbrMetallicRoughness.setBaseColorFactor([c[0], c[1], c[2], 0]); }
  }
  ceilOn = show; paintStageButtons();
}
viewer.addEventListener('load', () => { try { setCeiling(false); } catch (e) { $('#btn-ceil').hidden = true; } });
function paintStageButtons() {
  $('#btn-ceil').textContent = ceilOn ? T('ceiling_on') : T('ceiling_off');
  $('#btn-ceil').setAttribute('aria-pressed', String(ceilOn)); $('#btn-top').textContent = T('top');
}
$('#btn-ceil').onclick = () => { try { setCeiling(!ceilOn); } catch (e) {} };
$('#btn-top').onclick = () => { viewer.cameraOrbit = '0deg 0.5deg auto'; };

function timelineHTML(pc, di, days) {
  const D = days[di], now = Date.now(); let segs = '', windows = [], cur = null;
  for (let s = 0; s < SLOTS; s++) {
    const st = D.start + s * STEP, en = st + STEP, state = stateOf(pc, st, en, now).s, past = en <= now;
    segs += `<i class="s-${state}${past ? ' past' : ''}"></i>`;
    if (state === 'free' && !past) { if (!cur) cur = { s, e: s + 1 }; else cur.e = s + 1; } else if (cur) { windows.push(cur); cur = null; }
  }
  if (cur) windows.push(cur);
  const ticks = [0, 8, 16, 24, 32].map(s => `<span>${fmtTime(D.start + s * STEP)}</span>`).join('');
  const wins = windows.length ? windows.map(w => `<button type="button" data-win="${w.s}">${fmtRange(D.start + w.s * STEP, D.start + w.e * STEP)}</button>`).join('') : `<span class="muted">${esc(T('none'))}</span>`;
  return `<div class="timeline">${segs}</div><div class="ticks">${ticks}</div>
    <div class="muted" style="margin-top:12px">${esc(T('free_times'))} · ${fmtDay(D.start)}</div><div class="windows">${wins}</div>`;
}
function renderBook() {
  const days = clubDays(); const now = Date.now();
  if (S.slot < 0 || days[S.day].start + S.slot * STEP < now && S.day === 0) { const f = firstSlot(S.day, days); S.slot = f < 0 ? 0 : f; }
  S.dur = Math.min(S.dur, maxDurFor(S.day, S.slot, days));

    if (st.s === 'free') {
      const fu = freeUntil(S.pc, now, close), maxMin = Math.min(MAX_DUR, Math.floor((fu - now) / 60000)), opts = [];
      for (let m = 30; m <= maxMin; m += 30) opts.push(`<option value="${m}" ${m === S.walkDur ? 'selected' : ''}>${esc(fmtDur(m))}</option>`);
      if (maxMin >= 10 && maxMin % 30) opts.push(`<option value="${maxMin}">${esc(fmtDur(maxMin))}</option>`);
      body = `<div class="muted">${esc(fu < close ? tv('free_until', { t: fmtTime(fu) }) : T('free_now'))}</div>` +
        (opts.length ? `<select id="walk-dur" style="margin-top:10px">${opts.join('')}</select><button type="button" class="btn" data-walk="1">${esc(T('start_walkin'))}</button>` : `<div class="muted" style="margin-top:8px">${esc(T('busy_soon'))}</div>`);
    } else {
      const bk = st.bk, who = bk.user ? `${esc(bk.user.name)} ${esc(bk.user.surname)} · @${esc(bk.user.nick)}` : esc(T('guest'));
      body = `<div class="muted">${esc(fmtRange(bk.start, bk.end))} · ${who}</div>` +
        (st.s !== 'pending' ? `<button type="button" class="btn red" data-end="${bk.id}">${esc(T('end_session'))}</button>` : '');
    }
    pcCard = `<div class="card" id="sel"><div class="item"><h3>${esc(T('pc'))} ${S.pc}</h3><span class="pc s-${st.s}">${esc(T(st.s))}</span></div>${body}</div>`;
  }
  const upcoming = DB.list().filter(b => effStatus(b, now) === 'confirmed' && b.end > now).sort((x, y) => x.start - y.start).map(b =>
    `<div class="card"><div class="item"><div><b>${esc(T('pc'))} ${b.pc}</b> · ${esc(fmtDay(b.start))} · ${esc(fmtRange(b.start, b.end))}
    <div class="muted">${b.user ? esc(b.user.name) + ' ' + esc(b.user.surname) + ' · ' + esc(b.user.phone) : ''}</div></div>
    <button type="button" class="btn ghost" data-cancel="${b.id}" style="margin:0">${esc(T('cancel'))}</button></div></div>`).join('');
  $('#panel').innerHTML = `
    <h2>${esc(T('requests'))} (${pend.length})</h2>${reqs || `<p class="muted">${esc(T('none'))}</p>`}
    <h2>${esc(T('walkin_title'))}</h2><p class="muted" style="margin:0 0 8px">${esc(T('staff_hint'))}</p>${legend()}${pcGrid()}${pcCard}
    <h2>${esc(T('today_bookings'))}</h2>${upcoming || `<p class="muted">${esc(T('none'))}</p>`}
    <div class="btns" style="margin-top:20px"><button type="button" class="btn ghost" data-reset="1">${esc(T('reset'))}</button>
    <button type="button" class="btn ghost" data-staffout="1">${esc(T('staff_out'))}</button></div>`;
}
function renderStaffLogin() {
  $('#panel').innerHTML = `<div class="card"><h3>${esc(T('staff'))}</h3><label>${esc(T('pin'))}</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off"><div class="err" id="pin-err"></div>
    <button type="button" class="btn" data-pin="1">${esc(T('enter'))}</button></div><p class="note">${esc(T('demo'))}</p>`;
}
function render() {
  document.documentElement.lang = S.lang; renderLangs();
  if (!S.user && S.tab !== 'staff' && S.tab !== 'stafflogin') { $('#app').hidden = true; $('#signin').hidden = false; renderSignin(); return; }
  $('#signin').hidden = true; $('#app').hidden = false; paintStageButtons();
  if (S.tab === 'stafflogin') { $('#tabs').innerHTML = ''; $('#stage').hidden = true; renderStaffLogin(); return; }
  renderTabs(); $('#stage').hidden = S.tab === 'my';
  const days = clubDays();
  if (S.tab === 'book') renderBook(); else if (S.tab === 'my') renderMy(); else renderStaff();
  if (S.tab !== 'my') paintBadges(days);
}
function selectPC(n) {
  S.pc = n; render(); const el = $('#sel'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function modal(html) { $('#modal-text').innerHTML = html; $('#modal').hidden = false; }
$('#modal-ok').onclick = () => { $('#modal').hidden = true; };

/* ====================================================================
   EVENTS
   ==================================================================== */
document.addEventListener('click', e => {
  const x = e.target.closest('button, a'); if (!x) return;
  const d = x.dataset;
  if (d.lang) { S.lang = d.lang; store.set('kg_lang', S.lang); render(); return; }
  if (d.tab) { S.tab = d.tab; S.pc = null; render(); window.scrollTo(0, 0); return; }
  if (x.id === 'go-staff' || x.id === 'si-staff') { e.preventDefault(); S.tab = S.staff ? 'staff' : 'stafflogin'; render(); return; }
  if (d.day !== undefined) { S.day = +d.day; if (S.day === 0) { const f = firstSlot(0, clubDays()); S.slot = Math.max(S.slot, f < 0 ? 0 : f); } render(); return; }
  if (d.slot !== undefined) { S.slot = +d.slot; render(); return; }
  if (d.win !== undefined) { S.slot = +d.win; render(); return; }
  if (d.pc) { selectPC(+d.pc); return; }
  if (d.request) { requestBooking(); return; }
  if (d.cancel) { DB.update(d.cancel, { status: 'cancelled' }); render(); return; }
  if (d.logout) { store.del('kg_user'); S.user = null; S.tab = 'book'; render(); return; }
  if (d.pin) { tryPin(); return; }
  if (d.ok) { DB.update(d.ok, { status: 'confirmed' }); render(); return; }
  if (d.no) { DB.update(d.no, { status: 'rejected' }); render(); return; }
  if (d.walk) { startWalkin(); return; }
  if (d.end) { DB.update(d.end, { end: Date.now() }); render(); return; }
  if (d.reset) { seedDemo(); S.pc = null; render(); return; }
  if (d.staffout) { S.staff = false; S.tab = 'book'; S.pc = null; render(); return; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'dur') { S.dur = +e.target.value; render(); }
  if (e.target.id === 'walk-dur') { S.walkDur = +e.target.value; }
});
$('#si-form').addEventListener('submit', e => {
  e.preventDefault();
  const v = id => $(id).value.trim(), u = { name: v('#f-name'), surname: v('#f-surname'), nick: v('#f-nick'), phone: v('#f-phone') };
  if (!u.name || !u.surname || !u.nick || !u.phone) { $('#si-err').textContent = T('fill_all'); return; }
  if (digits(u.phone).length < 8) { $('#si-err').textContent = T('bad_phone'); return; }
  $('#si-err').textContent = ''; S.user = u; store.set('kg_user', JSON.stringify(u)); S.tab = 'book'; render();
});
function requestBooking() {
  const days = clubDays(), a = days[S.day].start + S.slot * STEP, b = a + S.dur * 60000, now = Date.now(), me = digits(S.user.phone);
  const pendingMine = DB.list().filter(x => x.user && digits(x.user.phone) === me && effStatus(x, now) === 'pending').length;
  if (pendingMine >= MAX_PENDING) { modal(`<p>${esc(T('too_many'))}</p>`); return; }
  if (stateOf(S.pc, a, b, now).s !== 'free') { modal(`<p>${esc(T('taken'))}</p>`); render(); return; }
  DB.add({ id: uid(), pc: S.pc, start: a, end: b, status: 'pending', createdAt: now, user: S.user });
  modal(`<p><b>${esc(T('pc'))} ${S.pc} · ${esc(fmtDay(a))} ${esc(fmtRange(a, b))}</b></p><p>${esc(tv('req_sent', { phone: S.user.phone }))}</p>`);
  S.tab = 'my'; S.pc = null; render();
}
function tryPin() {
  if ($('#pin').value === STAFF_PIN) { S.staff = true; S.tab = 'staff'; render(); } else $('#pin-err').textContent = T('bad_pin');
}
function startWalkin() {
  const now = Date.now(), m = +($('#walk-dur') ? $('#walk-dur').value : S.walkDur);
  if (stateOf(S.pc, now, now + m * 60000, now).s !== 'free') { render(); return; }
  DB.add({ id: uid(), pc: S.pc, start: now, end: now + m * 60000, status: 'walkin', createdAt: now, user: null }); render();
}

/* ====================================================================
   START
   ==================================================================== */
if (!store.get('kg_seeded')) seedDemo();
{ const f = firstSlot(0, clubDays()); if (f < 0) { S.day = 1; S.slot = 0; } else S.slot = f; }
if (location.hash === '#admin') S.tab = 'stafflogin';
render();
setInterval(() => { if (!document.hidden && !$('#modal').offsetParent && document.activeElement?.tagName !== 'SELECT') { try { render(); } catch (e) {} } }, 60000);
})();
</script>
</body>
</html>
